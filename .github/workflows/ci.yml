name: CI

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm xorriso qemu-system-x86 mtools dosfstools git

      - name: Clean
        run: make clean

      - name: Build ISO
        run: make iso

      - name: Build disk image
        run: make disk

      - name: Smoke test
        run: sh scripts/smoke.sh

      - name: User fault isolation test
        run: make fault-smoke

      - name: Preemption and process reuse test
        run: make preemption-smoke

      - name: Userspace file persistence test
        run: make persistence-smoke

      - name: Standalone editor test
        run: make editor-smoke

      - name: Full-disk save failure test
        run: make save-failure-smoke

      - name: Userspace session and recovery test
        run: make session-smoke
